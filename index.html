  <!-- Preconnects e Preloads -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="preload" as="image" href="banner.png" fetchpriority="high">
  <link rel="preload" as="image" href="superbancas.png" fetchpriority="high">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-70QZPPYYF7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-70QZPPYYF7');
  </script>

  <style>
    :root { --primary: #25D366; }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Roboto', system-ui, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #1a1a1a;
      overflow: hidden;
      height: 100dvh;
    }

    /* === BANNER OVERLAY (Tela Cheia) === */
    #banner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #banner-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .banner-container {
      position: relative;
      max-width: 95%;
      max-height: 90%;
    }

    #promo-banner {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
    }

    .close-banner-btn {
      position: absolute;
      top: -15px;
      right: -15px;
      background: #ff0000;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      cursor: pointer;
      border: 3px solid #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 10000;
      transition: all 0.3s ease;
    }

    .close-banner-btn:hover {
      transform: scale(1.1);
      background: #cc0000;
    }

    /* Conteúdo principal */
    .section {
      height: 100dvh;
      position: relative;
    }

    .iframe-placeholder {
      position: absolute;
      inset: 0;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #fff;
      z-index: 2;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- BANNER EM TELA CHEIA -->
  <div id="banner-overlay">
    <div class="banner-container">
      <div class="close-banner-btn" id="close-banner" title="Fechar">×</div>
      <img id="promo-banner" src="banner.png" alt="SuperBancas - Promoção">
    </div>
  </div>

  <main>
    <div class="section">
      <!-- Placeholder -->
      <div id="placeholder" class="iframe-placeholder">
        <div class="spinner"></div>
        <div>Carregando SuperBancas...</div>
      </div>

      <!-- Iframe -->
      <iframe 
        id="main-iframe"
        src="https://app.superbancas.club/pr/3IMRdWnG"
        fetchpriority="high"
        referrerpolicy="no-referrer-when-downgrade"
        allow="clipboard-read; clipboard-write; fullscreen; autoplay; encrypted-media"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-clipboard-read allow-clipboard-write"
        title="Plataforma SuperBancas">
      </iframe>
    </div>
  </main>

  <!-- Botão WhatsApp -->
  <div class="fab-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
    <a href="https://wa.me/5567981530813?text=Ol%C3%A1%20suporte%2C%20vim%20pelo%20site%20e%20preciso%20de%20ajuda" 
       target="_blank" rel="noopener noreferrer"
       class="fab-main" aria-label="Falar com suporte no WhatsApp">
      <i class="fab fa-whatsapp"></i>
      <span class="fab-label">Suporte</span>
    </a>
  </div>

  <script>
    const bannerOverlay = document.getElementById('banner-overlay');
    const closeBtn = document.getElementById('close-banner');
    const iframe = document.getElementById('main-iframe');
    const placeholder = document.getElementById('placeholder');

    // Fechar banner
    function closeBanner() {
      bannerOverlay.classList.add('hidden');
      setTimeout(() => {
        bannerOverlay.style.display = 'none';
      }, 600);
    }

    closeBtn.addEventListener('click', closeBanner);

    // Fechar com tecla ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape" && !bannerOverlay.classList.contains('hidden')) {
        closeBanner();
      }
    });

    // Carregamento do iframe
    iframe.addEventListener('load', () => {
      placeholder.classList.add('hidden');
      setTimeout(() => {
        placeholder.style.display = 'none';
      }, 400);
    });

    // Fallback
    setTimeout(() => {
      if (!placeholder.classList.contains('hidden')) {
        placeholder.classList.add('hidden');
      }
    }, 8000);
  </script>

</body>
</html>
