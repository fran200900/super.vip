  <style>
    :root { --primary: #25D366; }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Roboto', system-ui, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #1a1a1a;
      overflow: hidden;
      height: 100dvh;
    }

    .section { height: 100dvh; position: relative; }

    /* === VIDEO OVERLAY === */
    #video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    #video-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #promo-video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
      border-radius: 8px;
    }

    .close-video-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      border: 2px solid #fff;
      z-index: 10000;
      transition: all 0.3s ease;
    }

    .close-video-btn:hover {
      background: #ff0000;
      transform: scale(1.1);
    }

    .iframe-placeholder {
      position: absolute;
      inset: 0;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #fff;
      z-index: 2;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .iframe-placeholder.hidden {
      opacity: 0;
      pointer-events: none;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- VIDEO PROMOCIONAL -->
  <div id="video-overlay">
    <div class="close-video-btn" id="close-video" title="Fechar vídeo">×</div>
    <video id="promo-video" autoplay muted playsinline>
      <source src="video-super.mp4" type="video/mp4">
      Seu navegador não suporta o vídeo.
    </video>
  </div>

  <main>
    <div id="aguia" class="section">
      <div id="placeholder" class="iframe-placeholder">
        <div class="spinner"></div>
        <div>Carregando SuperBancas...</div>
      </div>

      <iframe 
        id="main-iframe"
        src="https://app.superbancas.club/pr/3IMRdWnG"
        fetchpriority="high"
        referrerpolicy="no-referrer-when-downgrade"
        allow="clipboard-read; clipboard-write; fullscreen; autoplay; encrypted-media"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-clipboard-read allow-clipboard-write"
        title="Plataforma SuperBancas">
      </iframe>
    </div>
  </main>

  <!-- Botão WhatsApp -->
  <div class="fab-container">
    <a href="https://wa.me/5567981530813?text=Ol%C3%A1%20suporte%2C%20vim%20pelo%20site%20e%20preciso%20de%20ajuda" 
       target="_blank" rel="noopener noreferrer"
       class="fab-main" aria-label="Falar com suporte no WhatsApp">
      <i class="fab fa-whatsapp"></i>
      <span class="fab-label">Suporte</span>
    </a>
  </div>

  <script>
    // ... (seu script permanece igual)
    const videoOverlay = document.getElementById('video-overlay');
    const promoVideo = document.getElementById('promo-video');
    const closeBtn = document.getElementById('close-video');
    const iframe = document.getElementById('main-iframe');
    const placeholder = document.getElementById('placeholder');

    function closeVideo() {
      videoOverlay.classList.add('hidden');
      promoVideo.pause();
      setTimeout(() => {
        videoOverlay.style.display = 'none';
      }, 600);
    }

    closeBtn.addEventListener('click', closeVideo);
    promoVideo.addEventListener('ended', () => setTimeout(closeVideo, 800));

    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape" && !videoOverlay.classList.contains('hidden')) closeVideo();
    });

    iframe.addEventListener('load', () => {
      placeholder.classList.add('hidden');
      setTimeout(() => placeholder.style.display = 'none', 400);
    });

    setTimeout(() => {
      if (!placeholder.classList.contains('hidden')) placeholder.classList.add('hidden');
    }, 8000);
  </script>
</body>
